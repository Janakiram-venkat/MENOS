name: Build MENOS Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENOS CPython Wheels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MENOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Inspect project configuration
        run: |
          set -eux

          python --version

          echo "===== Git status ====="
          git status --short

          echo "===== pyproject.toml ====="
          cat pyproject.toml

          echo "===== CMake LAPACKE configuration ====="
          sed -n '1,180p' src/common/CMakeLists.txt

          echo "===== Python binding configuration ====="
          sed -n '1,120p' src/python/CMakeLists.txt

          echo "===== Project files ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            ! -path './.venv/*' \
            | sort | head -200

      - name: Verify package compatibility metadata
        run: |
          python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              config = tomllib.load(f)

          project = config["project"]

          print("Package:", project["name"])
          print("Version:", project["version"])
          print("Python requirement:", project.get("requires-python"))

          assert project["name"].lower() == "menos"
          assert project["version"] == "1.1.0", (
              "Expected MENOS version 1.1.0."
          )
          assert project.get("requires-python") == ">=3.10", (
              "Expected requires-python = '>=3.10'."
          )
          PY

      - name: Install build tools
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel build auditwheel packaging

      - name: Build source distribution
        run: |
          set -o pipefail
          python -m build --sdist --verbose 2>&1 | tee sdist-build.log

      - name: Build MENOS wheels for Python 3.10-3.14
        run: |
          set -o pipefail
          python -m cibuildwheel \
            --output-dir wheelhouse \
            --debug-traceback 2>&1 | tee cibuildwheel.log
        env:
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_DEBUG_KEEP_CONTAINER: "true"

          CIBW_BEFORE_BUILD_LINUX: |
            set -eux

            echo "===== Installing system dependencies ====="
            yum install -y openblas-devel lapack-devel cmake make gcc gcc-c++

            echo "===== Preparing LAPACKE source ====="
            rm -rf /tmp/lapacke-src

            git clone \
              --depth 1 \
              --branch v3.12.1 \
              https://github.com/Reference-LAPACK/lapack.git \
              /tmp/lapacke-src

            echo "===== Configuring LAPACKE ====="
            cmake \
              -S /tmp/lapacke-src \
              -B /tmp/lapacke-src/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DBUILD_SHARED_LIBS=ON \
              -DLAPACKE=ON \
              -DBUILD_TESTING=OFF

            echo "===== Building LAPACKE ====="
            cmake --build /tmp/lapacke-src/build --parallel 2

            echo "===== Installing LAPACKE ====="
            cmake --install /tmp/lapacke-src/build
            ldconfig

            echo "===== Checking LAPACKE header ====="
            find /usr/local /usr/include -name lapacke.h -print
            test -f /usr/local/include/lapacke.h

            echo "===== Checking LAPACKE library ====="
            ldconfig -p | grep -i lapacke

      - name: Inspect and validate generated wheels
        if: success()
        run: |
          set -eux

          echo "===== Generated wheels ====="
          ls -lh wheelhouse/

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.utils import parse_wheel_filename

          expected = {"cp310", "cp311", "cp312", "cp313", "cp314"}
          found = set()
          wheels = sorted(Path("wheelhouse").glob("*.whl"))

          if not wheels:
              raise SystemExit("ERROR: No wheels were generated.")

          for wheel in wheels:
              print(f"\nChecking: {wheel.name}")

              name, version, build, tags = parse_wheel_filename(wheel.name)

              if name != "menos":
                  raise SystemExit(f"Unexpected package name: {name}")

              if str(version) != "1.1.0":
                  raise SystemExit(
                      f"Expected version 1.1.0, got {version}"
                  )

              python_tags = {tag.interpreter for tag in tags}
              supported = python_tags & expected

              if not supported:
                  raise SystemExit(
                      f"Unexpected Python compatibility tags: {python_tags}"
                  )

              found.update(supported)

              with ZipFile(wheel) as archive:
                  wheel_metadata = [
                      path for path in archive.namelist()
                      if path.endswith(".dist-info/WHEEL")
                  ]

                  if len(wheel_metadata) != 1:
                      raise SystemExit(
                          f"Invalid WHEEL metadata in {wheel.name}: "
                          f"{wheel_metadata}"
                      )

                  metadata = archive.read(wheel_metadata[0]).decode()
                  print("WHEEL metadata:")
                  print(metadata)

                  if "Tag:" not in metadata:
                      raise SystemExit(
                          f"No wheel tags found in {wheel.name}"
                      )

              print("Python tags:", sorted(python_tags))

          missing = expected - found

          if missing:
              raise SystemExit(
                  f"Missing wheels for Python versions: {sorted(missing)}"
              )

          print("\nSUCCESS: Wheels for CPython 3.10-3.14 were generated.")
          PY

          for wheel in wheelhouse/*.whl; do
            auditwheel show "$wheel"
          done

      - name: Print build failure summary
        if: failure()
        run: |
          echo "===== Relevant build errors ====="

          if [ -f cibuildwheel.log ]; then
            grep -in -B 10 -A 15 \
              -E 'LAPACKE|lapacke\.h|CMake Error|fatal error:|error:|FAILED|not found|No match for argument|fatal:|exit code' \
              cibuildwheel.log || true

            echo "===== Last 150 lines of build log ====="
            tail -n 150 cibuildwheel.log
          fi

          echo "===== Source distribution log ====="
          if [ -f sdist-build.log ]; then
            tail -n 60 sdist-build.log
          fi

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menos-build-diagnostics
          path: |
            cibuildwheel.log
            sdist-build.log
            wheelhouse/
            dist/
          if-no-files-found: warn
          retention-days: 14

  windows:
    # Native Windows wheels (docs/adr/0022 section 5). The cibuildwheel
    # settings live in pyproject.toml [tool.cibuildwheel.windows]: OpenBLAS is
    # fetched and hash-checked, delvewheel repairs, and each wheel runs the
    # Python suite.
    name: Build MENOS Windows Wheels
    runs-on: windows-latest

    steps:
      - name: Checkout MENOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install cibuildwheel==4.2.1 packaging

      # The runner also has MinGW on PATH; MENOS builds with MSVC only, so enter
      # the Visual Studio x64 developer environment for every later step.
      - name: Enter the Visual Studio developer environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $cmake = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake"
          $env:PATH = "$cmake\CMake\bin;$cmake\Ninja;$env:PATH"
          # PSModulePath is left out: this step's PowerShell 7 value puts PowerShell
          # 7's modules first, and Windows PowerShell 5.1 (which runs
          # scripts/fetch-openblas-windows.ps1) then cannot load Get-FileHash.
          Get-ChildItem env: | Where-Object Name -ne "PSModulePath" |
            ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Temporary diagnostic for the Windows wheel crash (docs/adr/0022): a
      # cp314 wheel with the release flags plus debug information, the crash
      # reproduced in three variants, and its stack under cdb.
      - name: "Diagnostic: build a wheel with debug information"
        continue-on-error: true
        shell: powershell
        run: |
          & .\scripts\fetch-openblas-windows.ps1 | Out-Null
          $env:CMAKE_GENERATOR = "Ninja"; $env:CC = "cl"; $env:CXX = "cl"
          python -m pip install delvewheel==1.13.1
          python -m pip wheel . --no-deps -w diag-dist -C build-dir=D:/menos-diag-build `
            "-Ccmake.define.CMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /EHsc /Z7" `
            "-Ccmake.define.CMAKE_MODULE_LINKER_FLAGS=/DEBUG /OPT:REF /OPT:ICF" `
            "-Ccmake.define.CMAKE_SHARED_LINKER_FLAGS=/DEBUG /OPT:REF /OPT:ICF"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $whl = (Get-ChildItem diag-dist\*.whl).FullName
          cmd /c "delvewheel repair -v --add-path ""%VCToolsRedistDir%x64\Microsoft.VC145.CRT"" --exclude libopenblas.dll --wheel-dir diag-wheel $whl"
          $repaired = (Get-ChildItem diag-wheel\*.whl).FullName
          python -m venv D:\diag-venv
          D:\diag-venv\Scripts\python -m pip install "$repaired[test]"
          New-Item -ItemType Directory -Force diag-pdb | Out-Null
          Get-ChildItem D:\menos-diag-build -Recurse -Filter *.pdb | Copy-Item -Destination diag-pdb

      - name: "Diagnostic: reproduce the crash"
        continue-on-error: true
        shell: powershell
        run: D:\diag-venv\Scripts\python scripts\windows-crash-repro.py

      - name: "Diagnostic: crash stack under cdb"
        continue-on-error: true
        shell: powershell
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { "cdb not found"; exit 0 }
          Set-Content -Encoding ascii diag-cdb.txt @(
            'sxd -c2 ".ecxr; kn 60; ~*kn 30; lm; q" av',
            'g',
            'q'
          )
          $pdb = (Resolve-Path diag-pdb).Path
          & $cdb -o -g -G -lines -y "$pdb;srv*D:\symcache*https://msdl.microsoft.com/download/symbols" `
            -cf diag-cdb.txt D:\diag-venv\Scripts\python.exe scripts\windows-crash-repro.py child 0

      - name: "Diagnostic: upload the debug wheel and symbols"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: menos-windows-diagnostic
          path: |
            diag-wheel/
            diag-pdb/
          if-no-files-found: warn
          retention-days: 14

      - name: Build MENOS wheels for Python 3.10-3.14
        shell: bash
        run: |
          set -o pipefail
          python -m cibuildwheel --platform windows --output-dir wheelhouse 2>&1 | tee cibuildwheel-windows.log

      - name: Validate generated wheels
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.utils import parse_wheel_filename

          expected = {"cp310", "cp311", "cp312", "cp313", "cp314"}
          found = set()
          for wheel in sorted(Path("wheelhouse").glob("*.whl")):
              name, version, _, tags = parse_wheel_filename(wheel.name)
              assert name == "menos", name
              assert str(version) == "1.1.0", version
              assert {tag.platform for tag in tags} == {"win_amd64"}, tags
              with ZipFile(wheel) as archive:
                  files = archive.namelist()
              assert "menos/libopenblas.dll" in files, wheel.name
              assert "menos/OPENBLAS_LICENSE" in files, wheel.name
              found |= {tag.interpreter for tag in tags}
          missing = expected - found
          assert not missing, f"missing wheels: {sorted(missing)}"
          print("SUCCESS: win_amd64 wheels for CPython 3.10-3.14")

      - name: Upload wheels and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menos-windows-wheels
          path: |
            cibuildwheel-windows.log
            wheelhouse/
          if-no-files-found: warn
          retention-days: 14
