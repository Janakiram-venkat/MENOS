name: Build MENOS Wheels

on:
  workflow_dispatch:
    inputs:
      gpu_runner:
        description: >-
          Runner label of a self-hosted machine with an NVIDIA GPU. When set,
          the CUDA wheel is also installed and run there, so the CUDA path is
          exercised on real hardware (GitHub-hosted runners have no GPU).
        required: false
        default: ""

permissions:
  contents: read

env:
  CUDA_VERSION: "12-9"
  CUDA_HOME: /usr/local/cuda-12.9

jobs:
  linux:
    name: Linux ${{ matrix.variant }} wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU-only wheel: CPython 3.10-3.14.
          - variant: cpu
            dist_name: menos
            cibw_build: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
            python_tags: "cp310 cp311 cp312 cp313 cp314"
          # "Auto" wheel: CUDA is compiled in and the planner uses the GPU
          # only when one is present at run time, otherwise the CPU engines.
          # CPython 3.12-3.14. Distribution name menos-cuda12 so that it can
          # sit beside the CPU wheel on an index; the import name is "menos".
          - variant: cuda
            dist_name: menos-cuda12
            cibw_build: "cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
            python_tags: "cp312 cp313 cp314"

    steps:
      - name: Checkout MENOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Name the CUDA distribution
        if: matrix.variant == 'cuda'
        run: |
          set -eux
          sed -i 's/^name = "menos"$/name = "menos-cuda12"/' pyproject.toml
          grep -n '^name = ' pyproject.toml
          grep -q '^name = "menos-cuda12"$' pyproject.toml

      - name: Inspect project configuration
        run: |
          set -eux
          python --version
          git status --short
          cat pyproject.toml
          sed -n '1,180p' src/common/CMakeLists.txt
          sed -n '1,120p' src/python/CMakeLists.txt

      - name: Verify package compatibility metadata
        run: |
          python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          print("Package:", project["name"])
          print("Version:", project["version"])
          print("Python requirement:", project.get("requires-python"))

          assert project["name"] == "${{ matrix.dist_name }}"
          assert project["version"] == "1.1.0", "Expected MENOS version 1.1.0."
          assert project.get("requires-python") == ">=3.10", (
              "Expected requires-python = '>=3.10'."
          )
          PY

      - name: Install build tools
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel build auditwheel packaging

      - name: Build source distribution
        if: matrix.variant == 'cpu'
        run: |
          set -o pipefail
          python -m build --sdist --verbose 2>&1 | tee sdist-build.log

      - name: Build MENOS ${{ matrix.variant }} wheels
        run: |
          set -o pipefail
          python -m cibuildwheel \
            --output-dir wheelhouse \
            --debug-traceback 2>&1 | tee cibuildwheel.log
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_DEBUG_KEEP_CONTAINER: "true"

          # CUDA wheel only: nvcc from the CUDA 12.9 toolkit, kernels for
          # Turing through Blackwell (the last entry also embeds PTX, so newer
          # GPUs still load it). CUDAARCHS is read by CMake itself, which
          # avoids quoting a ';' list inside CMAKE_ARGS. auditwheel bundles
          # libcudart; libcuda comes from the GPU driver and is only dlopen'd,
          # so the wheel imports and runs on the CPU on a machine with no GPU.
          CIBW_ENVIRONMENT_LINUX: >-
            LD_LIBRARY_PATH="/usr/local/lib64:/usr/local/lib:${{ matrix.variant == 'cuda' && format('{0}/lib64:{0}/targets/x86_64-linux/lib:', env.CUDA_HOME) || '' }}$LD_LIBRARY_PATH"
            ${{ matrix.variant == 'cuda' && format('CMAKE_ARGS="-DMENOS_ENABLE_CUDA=ON -DCMAKE_CUDA_COMPILER={0}/bin/nvcc -DCUDAToolkit_ROOT={0}" CUDAARCHS="75;80;86;89;90;120"', env.CUDA_HOME) || '' }}

          # Once per container, not once per Python version.
          CIBW_BEFORE_ALL_LINUX: |
            set -eux

            echo "===== Installing system dependencies ====="
            yum install -y openblas-devel lapack-devel cmake make gcc gcc-c++ git

            if [ "${{ matrix.variant }}" = "cuda" ]; then
              echo "===== Installing the CUDA toolkit (nvcc + cudart) ====="
              dnf install -y dnf-plugins-core
              dnf config-manager --add-repo \
                https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
              dnf install -y \
                cuda-nvcc-${{ env.CUDA_VERSION }} \
                cuda-cudart-devel-${{ env.CUDA_VERSION }}
              ${{ env.CUDA_HOME }}/bin/nvcc --version
              test -f ${{ env.CUDA_HOME }}/include/cuda_runtime.h
            fi

            echo "===== Preparing LAPACKE source ====="
            rm -rf /tmp/lapacke-src
            git clone --depth 1 --branch v3.12.1 \
              https://github.com/Reference-LAPACK/lapack.git /tmp/lapacke-src

            echo "===== Building and installing LAPACKE ====="
            cmake -S /tmp/lapacke-src -B /tmp/lapacke-src/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DBUILD_SHARED_LIBS=ON \
              -DLAPACKE=ON \
              -DBUILD_TESTING=OFF
            cmake --build /tmp/lapacke-src/build --parallel 2
            cmake --install /tmp/lapacke-src/build
            ldconfig

            test -f /usr/local/include/lapacke.h
            ldconfig -p | grep -i lapacke

          # Each wheel is installed into a clean environment and run. The
          # runner has no GPU, so this proves the wheel imports and runs on
          # the CPU, and that a CUDA wheel really has CUDA compiled in (its
          # refusal of a forced CUDA run says "no usable CUDA device", the
          # CPU wheel's says "no CUDA support").
          CIBW_TEST_EXTRAS: "test"
          CIBW_TEST_COMMAND: >-
            python {project}/scripts/check_wheel_backends.py ${{ matrix.variant }} &&
            pytest {project}/python/tests/test_wheel_smoke.py {project}/python/tests/test_backend_selection.py -q

      - name: Inspect and validate generated wheels
        if: success()
        env:
          DIST_NAME: ${{ matrix.dist_name }}
          PYTHON_TAGS: ${{ matrix.python_tags }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eux

          ls -lh wheelhouse/

          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.utils import parse_wheel_filename

          dist = os.environ["DIST_NAME"]
          expected = set(os.environ["PYTHON_TAGS"].split())
          cuda = os.environ["VARIANT"] == "cuda"
          found = set()
          wheels = sorted(Path("wheelhouse").glob("*.whl"))

          if not wheels:
              raise SystemExit("ERROR: No wheels were generated.")

          for wheel in wheels:
              print(f"\nChecking: {wheel.name}")
              name, version, build, tags = parse_wheel_filename(wheel.name)

              if str(name) != dist:
                  raise SystemExit(f"Unexpected package name: {name}")
              if str(version) != "1.1.0":
                  raise SystemExit(f"Expected version 1.1.0, got {version}")

              python_tags = {tag.interpreter for tag in tags}
              supported = python_tags & expected
              if not supported:
                  raise SystemExit(f"Unexpected Python tags: {python_tags}")
              found.update(supported)

              with ZipFile(wheel) as archive:
                  names = archive.namelist()
                  if len([n for n in names if n.endswith(".dist-info/WHEEL")]) != 1:
                      raise SystemExit(f"Invalid WHEEL metadata in {wheel.name}")
                  if not any(n.startswith("menos/_core") for n in names):
                      raise SystemExit(f"No menos._core extension in {wheel.name}")
                  has_cudart = any("libcudart" in n for n in names)
                  if cuda and not has_cudart:
                      raise SystemExit(f"{wheel.name}: libcudart was not bundled")
                  if not cuda and has_cudart:
                      raise SystemExit(f"{wheel.name}: CPU wheel contains libcudart")

          missing = expected - found
          if missing:
              raise SystemExit(f"Missing wheels for Python versions: {sorted(missing)}")

          print(f"\nSUCCESS: {os.environ['VARIANT']} wheels for {sorted(expected)}")
          PY

          for wheel in wheelhouse/*.whl; do
            auditwheel show "$wheel"
          done

      - name: Print build failure summary
        if: failure()
        run: |
          if [ -f cibuildwheel.log ]; then
            grep -in -B 10 -A 15 \
              -E 'LAPACKE|lapacke\.h|CUDA|nvcc|CMake Error|fatal error:|error:|FAILED|not found|No match for argument|fatal:|exit code' \
              cibuildwheel.log || true
            echo "===== Last 150 lines of build log ====="
            tail -n 150 cibuildwheel.log
          fi
          if [ -f sdist-build.log ]; then
            tail -n 60 sdist-build.log
          fi

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menos-linux-${{ matrix.variant }}-wheels
          path: |
            cibuildwheel.log
            sdist-build.log
            wheelhouse/
            dist/
          if-no-files-found: warn
          retention-days: 14

  cuda-gpu-test:
    # Optional: runs only when a GPU runner label is given. Installs the CUDA
    # wheel built above and checks that the GPU is actually used and agrees
    # with the CPU.
    name: Run the CUDA wheel on a GPU
    needs: linux
    if: inputs.gpu_runner != ''
    runs-on: ${{ inputs.gpu_runner }}

    steps:
      - name: Checkout MENOS
        uses: actions/checkout@v4

      - name: Download CUDA wheels
        uses: actions/download-artifact@v4
        with:
          name: menos-linux-cuda-wheels
          path: artifact

      - name: Install the wheel and run on the GPU
        run: |
          set -eux
          nvidia-smi
          python3 -m venv .venv
          . .venv/bin/activate
          pyver="cp$(python -c 'import sys; print(f"{sys.version_info[0]}{sys.version_info[1]}")')"
          wheel="$(ls artifact/wheelhouse/*-${pyver}-*.whl)"
          pip install "${wheel}[test]"
          python scripts/check_wheel_backends.py cuda --gpu

  windows:
    # Native Windows wheels (docs/adr/0022 section 5). The cibuildwheel
    # settings live in pyproject.toml [tool.cibuildwheel.windows]: OpenBLAS is
    # fetched and hash-checked, delvewheel repairs, and each wheel runs the
    # Python suite.
    name: Build MENOS Windows Wheels
    runs-on: windows-latest

    steps:
      - name: Checkout MENOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install cibuildwheel==4.2.1 packaging

      # The runner also has MinGW on PATH; MENOS builds with MSVC only, so enter
      # the Visual Studio x64 developer environment for every later step. The
      # 14.50 toolset is pinned: 14.51 miscompiles MENOS and CMake refuses it
      # (docs/adr/0022 section 3.1).
      - name: Enter the Visual Studio developer environment (MSVC 14.50)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.50.*")) {
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            Start-Process -Wait -FilePath $setup -ArgumentList @("modify", "--installPath", "`"$vs`"",
              "--add", "Microsoft.VisualStudio.Component.VC.14.50.18.0.x86.x64",
              "--quiet", "--norestart", "--nocache")
          }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.50.*")) {
            Get-ChildItem "$vs\VC\Tools\MSVC" | ForEach-Object Name
            throw "the MSVC 14.50 toolset is not available"
          }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64 -vcvars_ver=14.50"
          $cmake = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake"
          $env:PATH = "$cmake\CMake\bin;$cmake\Ninja;$env:PATH"
          (Get-Command cl).Source
          # PSModulePath is left out: this step's PowerShell 7 value puts PowerShell
          # 7's modules first, and Windows PowerShell 5.1 (which runs
          # scripts/fetch-openblas-windows.ps1) then cannot load Get-FileHash.
          Get-ChildItem env: | Where-Object Name -ne "PSModulePath" |
            ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The C++ suite with the same compiler as the wheels, so a miscompile is
      # caught here too, not only through the Python tests.
      - name: Build and test the C++ suite (windows-release)
        shell: powershell
        run: |
          & .\scripts\fetch-openblas-windows.ps1 | Out-Null
          cmake --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --preset windows-release -j 4 --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build MENOS wheels for Python 3.10-3.14
        shell: bash
        run: |
          set -o pipefail
          python -m cibuildwheel --platform windows --output-dir wheelhouse 2>&1 | tee cibuildwheel-windows.log

      - name: Validate generated wheels
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.utils import parse_wheel_filename

          expected = {"cp310", "cp311", "cp312", "cp313", "cp314"}
          found = set()
          for wheel in sorted(Path("wheelhouse").glob("*.whl")):
              name, version, _, tags = parse_wheel_filename(wheel.name)
              assert name == "menos", name
              assert str(version) == "1.1.0", version
              assert {tag.platform for tag in tags} == {"win_amd64"}, tags
              with ZipFile(wheel) as archive:
                  files = archive.namelist()
              assert "menos/libopenblas.dll" in files, wheel.name
              assert "menos/OPENBLAS_LICENSE" in files, wheel.name
              found |= {tag.interpreter for tag in tags}
          missing = expected - found
          assert not missing, f"missing wheels: {sorted(missing)}"
          print("SUCCESS: win_amd64 wheels for CPython 3.10-3.14")

      - name: Upload wheels and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menos-windows-wheels
          path: |
            cibuildwheel-windows.log
            wheelhouse/
          if-no-files-found: warn
          retention-days: 14
