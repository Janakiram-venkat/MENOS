name: Build MENOS Linux Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENOS CPython Wheels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MENOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Inspect project configuration
        run: |
          set -eux

          python --version

          echo "===== Git status ====="
          git status --short

          echo "===== pyproject.toml ====="
          cat pyproject.toml

          echo "===== CMake LAPACKE configuration ====="
          sed -n '1,180p' src/common/CMakeLists.txt

          echo "===== Project files ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            ! -path './.venv/*' \
            | sort | head -200

      - name: Verify package compatibility metadata
        run: |
          python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              config = tomllib.load(f)

          project = config["project"]

          print("Package:", project["name"])
          print("Version:", project["version"])
          print("Python requirement:", project.get("requires-python"))

          assert project["name"].lower() == "menos"
          assert project["version"] == "1.1.0", (
              "Expected MENOS version 1.1.0. "
              "Update this assertion if you intend to publish another version."
          )
          assert project.get("requires-python") == ">=3.10", (
              "Expected requires-python = '>=3.10'. "
              "Confirm your intended compatibility range."
          )
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel build

      - name: Check source distribution
        run: |
          set -o pipefail
          python -m build --sdist --verbose 2>&1 | tee sdist-build.log

      - name: Build MENOS wheels for Python 3.10-3.14
        run: |
          set -o pipefail
          python -m cibuildwheel \
            --output-dir wheelhouse \
            --debug-traceback 2>&1 | tee cibuildwheel.log
        env:
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_DEBUG_KEEP_CONTAINER: "true"

          CIBW_BEFORE_BUILD_LINUX: >-
            set -eux;
            yum install -y openblas-devel lapack-devel cmake make gcc gcc-c++;
            cd /tmp;
            git clone --depth 1 --branch v3.12.1 https://github.com/Reference-LAPACK/lapack.git lapacke-src;
            cmake -S /tmp/lapacke-src -B /tmp/lapacke-src/build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=/usr/local
            -DBUILD_SHARED_LIBS=ON
            -DLAPACKE=ON
            -DBUILD_TESTING=OFF;
            cmake --build /tmp/lapacke-src/build --parallel 2;
            cmake --install /tmp/lapacke-src/build;
            ldconfig;
            echo '=== Verify LAPACKE header ===';
            find /usr/local /usr/include -name lapacke.h -print;
            test -f /usr/local/include/lapacke.h;
            echo '=== Verify LAPACKE library ===';
            ldconfig -p | grep -i lapacke

      - name: Inspect and validate generated wheels
        if: success()
        run: |
          set -eux

          echo "===== Generated wheels ====="
          ls -lh wheelhouse/

          python -m pip install auditwheel packaging

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.utils import parse_wheel_filename

          expected = {"cp310", "cp311", "cp312", "cp313", "cp314"}
          found = set()

          wheels = sorted(Path("wheelhouse").glob("*.whl"))

          if not wheels:
              raise SystemExit("ERROR: No wheels were generated.")

          for wheel in wheels:
              print(f"\nChecking: {wheel.name}")

              name, version, build, tags = parse_wheel_filename(wheel.name)

              if name != "menos":
                  raise SystemExit(f"Unexpected package name: {name}")

              if str(version) != "1.1.0":
                  raise SystemExit(
                      f"Expected version 1.1.0, got {version} in {wheel.name}"
                  )

              python_tags = {tag.interpreter for tag in tags}
              supported = python_tags & expected

              if not supported:
                  raise SystemExit(
                      f"Unexpected Python compatibility tags: {python_tags}"
                  )

              found.update(supported)

              with ZipFile(wheel) as archive:
                  wheel_metadata = [
                      path for path in archive.namelist()
                      if path.endswith(".dist-info/WHEEL")
                  ]

                  if len(wheel_metadata) != 1:
                      raise SystemExit(
                          f"Invalid WHEEL metadata in {wheel.name}: "
                          f"{wheel_metadata}"
                      )

                  print("WHEEL metadata:", wheel_metadata[0])
                  print("Python tags:", sorted(python_tags))

          missing = expected - found

          if missing:
              raise SystemExit(
                  f"Missing wheels for Python versions: {sorted(missing)}"
              )

          print("\nSUCCESS: Wheels for CPython 3.10-3.14 were generated.")
          PY

          for wheel in wheelhouse/*.whl; do
            auditwheel show "$wheel"
          done

      - name: Print build failure summary
        if: failure()
        run: |
          echo "===== Relevant build errors ====="

          if [ -f cibuildwheel.log ]; then
            grep -in -B 10 -A 15 \
              -E 'LAPACKE|lapacke\.h|CMake Error|fatal error:|error:|FAILED|not found|No match for argument' \
              cibuildwheel.log || true

            echo "===== Last 120 lines of build log ====="
            tail -n 120 cibuildwheel.log
          fi

          echo "===== Source distribution log ====="
          if [ -f sdist-build.log ]; then
            tail -n 60 sdist-build.log
          fi

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menos-build-diagnostics
          path: |
            cibuildwheel.log
            sdist-build.log
            wheelhouse/
            dist/
          if-no-files-found: warn
          retention-days: 14