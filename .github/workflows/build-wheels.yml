name: Build MENOS Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Native Windows wheels (docs/adr/0022 section 5). The cibuildwheel
    # settings live in pyproject.toml [tool.cibuildwheel.windows]: OpenBLAS is
    # fetched and hash-checked, delvewheel repairs, and each wheel runs the
    # Python suite.
    name: Build MENOS Windows Wheels
    runs-on: windows-latest

    steps:
      - name: Checkout MENOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install cibuildwheel==4.2.1 packaging

      # The runner also has MinGW on PATH; MENOS builds with MSVC only, so enter
      # the Visual Studio x64 developer environment for every later step. The
      # 14.50 toolset is pinned: 14.51 miscompiles MENOS and CMake refuses it
      # (docs/adr/0022 section 3.1).
      - name: Enter the Visual Studio developer environment (MSVC 14.50)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.50.*")) {
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            Start-Process -Wait -FilePath $setup -ArgumentList @("modify", "--installPath", "`"$vs`"",
              "--add", "Microsoft.VisualStudio.Component.VC.14.50.18.0.x86.x64",
              "--quiet", "--norestart", "--nocache")
          }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.50.*")) {
            Get-ChildItem "$vs\VC\Tools\MSVC" | ForEach-Object Name
            throw "the MSVC 14.50 toolset is not available"
          }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64 -vcvars_ver=14.50"
          $cmake = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake"
          $env:PATH = "$cmake\CMake\bin;$cmake\Ninja;$env:PATH"
          (Get-Command cl).Source
          # PSModulePath is left out: this step's PowerShell 7 value puts PowerShell
          # 7's modules first, and Windows PowerShell 5.1 (which runs
          # scripts/fetch-openblas-windows.ps1) then cannot load Get-FileHash.
          Get-ChildItem env: | Where-Object Name -ne "PSModulePath" |
            ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The C++ suite with the same compiler as the wheels, so a miscompile is
      # caught here too, not only through the Python tests.
      - name: Build and test the C++ suite (windows-release)
        shell: powershell
        run: |
          & .\scripts\fetch-openblas-windows.ps1 | Out-Null
          cmake --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --preset windows-release -j 4 --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build MENOS wheels for Python 3.10-3.14
        shell: bash
        run: |
          set -o pipefail
          python -m cibuildwheel --platform windows --output-dir wheelhouse 2>&1 | tee cibuildwheel-windows.log

      - name: Validate generated wheels
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.utils import parse_wheel_filename

          expected = {"cp310", "cp311", "cp312", "cp313", "cp314"}
          found = set()
          for wheel in sorted(Path("wheelhouse").glob("*.whl")):
              name, version, _, tags = parse_wheel_filename(wheel.name)
              assert name == "menos", name
              assert str(version) == "1.2.0", version
              assert {tag.platform for tag in tags} == {"win_amd64"}, tags
              with ZipFile(wheel) as archive:
                  files = archive.namelist()
              assert "menos/libopenblas.dll" in files, wheel.name
              assert "menos/OPENBLAS_LICENSE" in files, wheel.name
              found |= {tag.interpreter for tag in tags}
          missing = expected - found
          assert not missing, f"missing wheels: {sorted(missing)}"
          print("SUCCESS: win_amd64 wheels for CPython 3.10-3.14")

      - name: Upload wheels and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menos-windows-wheels
          path: |
            cibuildwheel-windows.log
            wheelhouse/
          if-no-files-found: warn
          retention-days: 14
